name: daakia_vc_flutter_sdk
description: "A ready-to-use Flutter SDK for seamless audio/video calls, group meetings, and scalable conferencing solutions."
version: 4.6.0-SNAPSHOT
homepage: https://github.com/daakia/daakia_vc_flutter_sdk

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.6"

platforms:
  android:
  ios:

dependencies:
  sentry_flutter: ^9.30.1
  flutter:
    sdk: flutter

  retrofit: ^4.10.0
  logger: ^2.8.0
  json_annotation: ^4.12.0
  dio: ^5.11.1
  loading_btn: ^1.0.3
  livekit_client: ^2.13.2
  pretty_dio_logger: ^1.4.0

  permission_handler: ^13.0.2
  flutter_background: ^1.3.1
  provider: ^6.1.5+1
  uuid: ^4.6.0
  intl: ^0.20.3
  collection: ^1.19.1
  flutter_webrtc: ^1.6.3
  animated_emoji: ^3.3.0
  safe_device: ^1.4.1
  wakelock_plus: ^1.8.1
  package_info_plus: ^10.2.2
  simple_pip_mode: ^1.1.0
  flutter_link_previewer: ^3.2.2
  flutter_chat_types: ^3.6.2
  mime: ^2.1.0
  open_file: ^4.0.0
  webview_flutter: ^4.14.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0
  audioplayers: ^6.8.1
  datadog_flutter_plugin: ^3.7.0
  connectivity_plus: ^7.3.2
  device_info_plus: ^13.3.0
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  timezone: ^0.11.1

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.2.6
  build_runner: ^2.7.1
  json_serializable: ^6.11.0


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: io.daakia.daakia_vc_flutter_sdk
        pluginClass: DaakiaVcFlutterSdkPlugin
      ios:
        pluginClass: DaakiaVcFlutterSdkPlugin

  assets:
    - assets/icons/
    - assets/sounds/
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: daakia-op
